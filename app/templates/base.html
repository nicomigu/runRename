<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LogLine{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
        <a href="/" class="text-xl font-bold text-orange-500">LogLine</a>
        {% if user %}
        <div class="flex items-center gap-4">
            {% if user.profile_pic %}
            <img src="{{ user.profile_pic }}" alt="Avatar of {{ user.name or 'User' }}" class="w-8 h-8 rounded-full">
            {% endif %}
            <span class="text-sm text-gray-400">{{ user.name }}</span>
            <a href="/auth/logout" class="text-sm text-gray-500 hover:text-gray-300">Logout</a>
        </div>
        {% endif %}
    </nav>
    <main class="max-w-2xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
